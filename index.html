<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC">
<meta name="description" content="A soft landing after a hard day: a gentle planner and AI companion for students and adults.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Softland">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Softland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F5F2EC; --card:#FFFFFF; --ink:#22343A; --muted:#6C7C80; --line:#E6E1D8;
  --brand:#2C7A70; --brand-ink:#FFFFFF; --brand-soft:#E2EFEB;
  --peach:#F3B88F; --peach-soft:#FBEADD; --lilac:#B9A8E0; --lilac-soft:#EEE9F8;
  --sun:#F2CF6B; --rose:#E59A9A;
  --shadow:0 2px 14px rgba(34,52,58,.07);
  --r:22px; --nav:76px;
  --display:'Fraunces',Georgia,serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B1D; --card:#1C272A; --ink:#E7EEEC; --muted:#93A3A5; --line:#2A383B;
    --brand:#5FB8A9; --brand-ink:#0F1A1B; --brand-soft:#21383A;
    --peach-soft:#3A2C24; --lilac-soft:#2B2740; --shadow:0 2px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B1D; --card:#1C272A; --ink:#E7EEEC; --muted:#93A3A5; --line:#2A383B;
  --brand:#5FB8A9; --brand-ink:#0F1A1B; --brand-soft:#21383A;
  --peach-soft:#3A2C24; --lilac-soft:#2B2740; --shadow:0 2px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:.3em 0 .7em}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--nav) + 90px)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:0 0 14px;border:1px solid var(--line)}
.card.soft{background:var(--brand-soft);border-color:transparent}
.card.peach{background:var(--peach-soft);border-color:transparent}
.card.lilac{background:var(--lilac-soft);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:1rem;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.quiet{background:var(--brand-soft);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem}
.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand-soft);display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.iconbtn.on{background:var(--rose);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
textarea,input[type=text],input[type=password],input[type=time],input[type=number],select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;outline:none;font-size:1rem}
textarea{min-height:92px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--brand)}
label.lbl{display:block;font-weight:700;margin:12px 0 6px;font-size:.95rem}
.inputmic{position:relative}
.inputmic textarea{padding-right:60px}
.inputmic .iconbtn{position:absolute;right:8px;bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:.95rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.energy button{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:12px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted);min-height:78px}
.energy button span{font-size:1.65rem}
.energy button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--ink)}
.reply{white-space:normal}
.reply p:first-child{margin-top:0}
.reply ul{margin:.3em 0 .7em;padding-left:1.2em}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:1rem}
.tile .em{font-size:1.6rem}
.tile small{color:var(--muted);font-size:.84rem;line-height:1.3}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;min-width:0;padding:0 2px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);white-space:nowrap}
nav.tabs button span{font-size:1.35rem}
nav.tabs button.on{color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:21;border:0;border-radius:999px;padding:12px 18px;min-height:50px;background:var(--lilac);color:#231C3A;font-weight:800;box-shadow:0 6px 20px rgba(60,40,110,.25)}
/* lists */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--brand);background:none;flex:none;display:flex;align-items:center;justify-content:center;color:var(--brand-ink);font-size:.9rem}
.check.on{background:var(--brand)}
.done-txt{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--brand-soft);font-size:.78rem;font-weight:700}
.block-row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--bg);margin-bottom:8px;border:1px solid var(--line)}
.block-row input[type=time]{width:136px;padding:8px 10px;flex:none}
.block-row .lab{flex:1;min-width:0}
.block-row .mini{border:0;background:none;font-size:1.05rem;padding:6px;color:var(--muted);min-width:34px;min-height:40px}
.block-row.dragging{opacity:.4}
.e-high{border-left:5px solid var(--sun)} .e-med{border-left:5px solid var(--peach)} .e-low{border-left:5px solid var(--lilac)}
.bigtime{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.bigtime div{background:var(--card);border-radius:16px;padding:10px 4px;border:1px solid var(--line)}
.bigtime b{display:block;font-family:var(--display);font-size:1.35rem}
.bigtime small{color:var(--muted);font-size:.8rem;font-weight:700}
/* overlay */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;animation:fade .3s}
.overlay .wrap{padding-bottom:40px}
@keyframes fade{from{opacity:0}}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.breath{width:190px;height:190px;margin:26px auto;border-radius:50%;background:radial-gradient(circle,var(--brand-soft) 0%,var(--brand) 140%);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.62)}40%{transform:scale(1)}}
.timer{font-family:var(--display);font-size:3.4rem;text-align:center;margin:10px 0}
.center{text-align:center}
.support{background:var(--peach-soft);border:2px solid var(--peach);border-radius:var(--r);padding:16px;margin:0 0 14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin:10px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--brand);min-height:4px}
.bars small{font-size:.74rem;color:var(--muted);font-weight:700}
.jar{width:150px;height:170px;margin:6px auto 12px;border:4px solid var(--line);border-top-width:10px;border-radius:24px 24px 40px 40px;position:relative;overflow:hidden;background:var(--card)}
.jar .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--sun),var(--peach));opacity:.75;transition:height .6s}
.jar .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2rem;font-weight:600}
.photo{max-width:100%;border-radius:16px;margin-top:8px;display:block}
.chat .msg{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:88%}
.chat .me{background:var(--brand-soft);margin-left:auto}
.chat .ai{background:var(--bg);border:1px solid var(--line)}
.step-dot{display:flex;gap:6px;justify-content:center;margin:8px 0}
.step-dot i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.step-dot i.on{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;font-size:.92rem;animation:fade .2s;max-width:90vw;text-align:center}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.switch input{width:52px;height:30px;appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{left:25px}
input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;outline:none;font-size:1rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.week button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;min-height:68px;min-width:0}
.week button small{font-size:.72rem;color:var(--muted);font-weight:700}
.week button b{font-size:1.1rem}
.week button i{font-style:normal;color:var(--brand);font-size:.8rem;line-height:1;letter-spacing:1px}
.week button.today{border-color:var(--peach)}
.week button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.week button.on small,.week button.on i{color:var(--brand-ink)}
.mini-btn{border:0;background:var(--brand-soft);border-radius:50%;width:40px;height:40px;flex:none;font-size:1rem}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{border:0;background:none;color:var(--brand);font-weight:700;padding:8px 0;min-height:44px}
.type-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-pick button{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:18px 12px;text-align:center;min-height:130px}
.type-pick button.on{border-color:var(--brand);background:var(--brand-soft)}
.type-pick span{font-size:2.2rem;display:block}
@media (max-width:380px){ .energy button{font-size:.7rem} .tiles{gap:9px} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-go="home"><span>🏡</span>Land</button>
  <button data-go="today"><span>🧭</span>Today</button>
  <button data-go="planner"><span>🗓️</span>Planner</button>
  <button data-go="tomorrow"><span>🌅</span>Tomorrow</button>
  <button data-go="journal"><span>📓</span>Journal</button>
  <button data-go="more"><span>✨</span>More</button>
</div></nav>
<button class="fab" id="fab" hidden>🫧 Too much</button>

<script>
'use strict';
/* ============================================================
   Softland — single-file web app.
   AI: Google Gemini API, using the user's own (free) API key.
   All data stays in this browser's localStorage.
   ============================================================ */

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey = (d = new Date()) => d.toLocaleDateString('en-CA');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const app = $('#app');

/* ---------------- state ---------------- */
const STORE = 'softland:v1';
const DEFAULTS = {
  profile: null, // {name, type:'kid'|'adult', sleepHours, arrival:'17:00'}
  settings: { apiKey: '', model: 'gemini-flash-latest', voiceReplies: false, theme: 'auto', nudges: false,
    buddy: { on: false, name: '' }, parent: { on: false } },
  checkins: [],       // {t, energy, moods[], note, reply}
  rituals: {},        // {dayKey: true}
  days: {},           // {dayKey: {items:[{id,text,priority,minutes,why,done}], note}}
  plans: {},          // {dayKey(target day): {goal, wake, bed, screensOff, tonight[], blocks[], note}}
  journal: [],        // {id,t,prompt,text,photo,chat[],gratitude:bool}
  explore: { likes: [], history: [], current: [] }, // history:{t,name,feel}
  focus: { last: null },
  lookbacks: [],      // {t, text}
  planner: [],        // {id,title,date,time,cat,done}
  fired: {}           // reminders fired {kind+day:true}
};
let S = load();
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!raw) return structuredClone(DEFAULTS);
    const s = Object.assign(structuredClone(DEFAULTS), raw);
    s.settings = Object.assign(structuredClone(DEFAULTS.settings), raw.settings || {});
    s.planner = Array.isArray(raw.planner) ? raw.planner : [];
    s.explore = Object.assign(structuredClone(DEFAULTS.explore), raw.explore || {});
    return s;
  } catch { return structuredClone(DEFAULTS); }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); }
  catch (e) { toast('Storage is full — try removing some journal photos.'); }
}
const isKid = () => S.profile?.type === 'kid';
const lastCheckin = () => S.checkins[S.checkins.length - 1];
const todaysCheckin = () => { const c = lastCheckin(); return c && dayKey(new Date(c.t)) === dayKey() ? c : null; };
const day = (k = dayKey()) => (S.days[k] ||= { items: [], note: '' });

function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
}
applyTheme();

/* ---------------- small UI helpers ---------------- */
function toast(msg, ms = 2600) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function md(text) {
  // tiny, safe markdown: **bold**, *italics*, bullet lists, paragraphs
  const lines = esc(text).split(/\n/);
  let out = '', inList = false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (l.trim()) out += `<p>${l.replace(/^#+\s*/, '')}</p>`;
  }
  if (inList) out += '</ul>';
  return out;
}
function sheet(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  function close() { bg.remove(); }
  onMount?.(bg.firstElementChild, close);
  return close;
}
function fmt12(hhmm) {
  if (!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return hhmm || '';
  let [h, m] = hhmm.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ap}`;
}
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = n => { n = ((n % 1440) + 1440) % 1440; return `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`; };
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 17 ? 'Hey there' : h < 21 ? 'Welcome home' : 'Evening';
}

/* ---------------- voice (Web Speech API) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function micBtn(id) { return SR ? `<button class="iconbtn" type="button" data-mic="${id}" aria-label="Speak instead of typing">🎙️</button>` : ''; }
function bindMics(root = app) {
  $$('[data-mic]', root).forEach(b => b.onclick = () => {
    const field = document.getElementById(b.dataset.mic);
    if (b.classList.contains('on')) { b._rec?.stop(); return; }
    const rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = true;
    const base = field.value ? field.value.trim() + ' ' : '';
    rec.onresult = e => { field.value = base + [...e.results].map(r => r[0].transcript).join(''); };
    rec.onend = () => b.classList.remove('on');
    rec.onerror = () => { b.classList.remove('on'); toast('Microphone not available'); };
    b._rec = rec; b.classList.add('on'); rec.start();
  });
}
function speak(text) {
  if (!S.settings.voiceReplies || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, '')); u.rate = 0.95; u.pitch = 1.02;
  speechSynthesis.speak(u);
}

/* ---------------- safety ---------------- */
const DISTRESS = /(suicid|kill myself|killing myself|end my life|want to die|wanna die|don'?t want to (be alive|live)|self[- ]?harm|hurt(ing)? myself|cut(ting)? myself|no reason to live|end it all|better off dead)/i;
function supportCard() {
  return `<div class="support"><h3>You matter 💛</h3>
  <p>It sounds like things are really heavy right now. You don't have to carry this alone.</p>
  ${isKid() ? '<p><b>Please tell a parent, teacher, school counselor or another adult you trust today.</b></p>' : '<p>Reaching out to someone you trust, or a professional, can really help.</p>'}
  <p class="small">If you might be in danger, call your local emergency number now.<br>
  US: call or text <b>988</b> · UK &amp; Ireland: Samaritans <b>116 123</b> · Canada: <b>988</b> · Australia: Lifeline <b>13 11 14</b><br>
  Anywhere else: <a href="https://findahelpline.com" target="_blank" rel="noopener">findahelpline.com</a></p></div>`;
}
const needsSupport = (...texts) => texts.some(t => t && DISTRESS.test(t));

/* ---------------- AI (Google Gemini) ---------------- */
function persona() {
  const p = S.profile || {};
  const who = isKid()
    ? `The user is a student/kid${p.name ? ' named ' + p.name : ''} coming home from school. Use simple, short words a 10-15 year old understands. School mode: think homework, tests, classes, after-school energy.`
    : `The user is an adult${p.name ? ' named ' + p.name : ''} coming home from work. Work mode: think workday stress, chores, evenings, switching off from work.`;
  return `You are Moss, the friendly companion inside Softland, an app that gives people a soft landing after school or work.
${who}
Personality: a warm, casual friend. Never clinical, never bossy, never preachy.

function contextLine() {

class AIError extends Error {}
async function ai({ prompt, history, json = false, task = '' }) {
  const key = S.settings.apiKey?.trim();
  if (!key) throw new AIError('nokey');
  const contents = history
    ? history.map(m => ({ role: m.role === 'ai' ? 'model' : 'user', parts: [{ text: m.text }] }))
    : [{ role: 'user', parts: [{ text: prompt }] }];
  const body = {
    systemInstruction: { parts: [{ text: persona() + '\n' + contextLine() + (task ? '\nTask: ' + task : '') }] },
    contents,
    generationConfig: { temperature: 0.85, ...(json ? { responseMimeType: 'application/json' } : {}) }
  };
  const models = [...new Set([S.settings.model || 'gemini-flash-latest', 'gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.0-flash'])];
  let lastErr;
  for (const model of models) {
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(body)
      });
    } catch { throw new AIError('Could not reach Gemini. Check your internet connection.'); }
    if (res.status === 404) { lastErr = new AIError(`Model "${model}" not found.`); continue; }
    if (!res.ok) {
      let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch {}
      if (res.status === 429) throw new AIError('The free Gemini limit was reached for now. Give it a minute and try again.');
      if (/api key/i.test(msg) || res.status === 401 || res.status === 403) throw new AIError('Your Gemini API key doesn\'t seem to work. Check it in Settings.');
      if (res.status >= 500) { lastErr = new AIError('Gemini is busy right now. Try again in a moment.'); continue; }
      throw new AIError(msg || `Gemini error ${res.status}`);
    }
    const data = await res.json();
    const text = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) throw new AIError('Gemini sent an empty reply. Try again?');
    if (!json) return text;
    try { return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, '')); }
    catch { throw new AIError('Got a jumbled reply. Try again?'); }
  }
  throw lastErr || new AIError('Something went wrong.');
}
function aiErrorHtml(e) {
  if (e.message === 'nokey') return `<p>Moss needs a free Gemini key to give personal replies. <a href="#settings">Add one in Settings</a> — it takes a minute.</p>`;

const Sound = {
  ctx: null, nodes: [], current: null, gain: null, vol: 0.4,
  ensure() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.gain = this.ctx.createGain(); this.gain.gain.value = this.vol; this.gain.connect(this.ctx.destination); } this.ctx.resume(); },
  noise(type) {
    const c = this.ctx, len = c.sampleRate * 4, buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let last = 0, b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (type === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
        else { b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048; d[i] = (b0 + b1 + b2 + w * 0.02) * 0.9; }
      }
    }
    const s = c.createBufferSource(); s.buffer = buf; s.loop = true; return s;
  },
  play(kind) {
    this.stop(); this.ensure(); const c = this.ctx; const out = c.createGain(); out.gain.value = 0; out.connect(this.gain);
    out.gain.linearRampToValueAtTime(1, c.currentTime + 2);
    if (kind === 'rain') { const n = this.noise('pink'); const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 400; n.connect(f).connect(out); n.start(); this.nodes.push(n); }
    if (kind === 'brown') { const n = this.noise('brown'); n.connect(out); n.start(); this.nodes.push(n); }
    if (kind === 'ocean') {
      const n = this.noise('pink'); const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      const g = c.createGain(); g.gain.value = 0.5; const lfo = c.createOscillator(); lfo.frequency.value = 0.09; const lg = c.createGain(); lg.gain.value = 0.45;
      lfo.connect(lg).connect(g.gain); n.connect(f).connect(g).connect(out); n.start(); lfo.start(); this.nodes.push(n, lfo);
    }
    if (kind === 'hum') {
      [130.81, 196.0, 261.63, 329.63].forEach((fr, i) => {
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = fr; const g = c.createGain(); g.gain.value = 0.07 / (i * 0.5 + 1);
        const l = c.createOscillator(); l.frequency.value = 0.05 + i * 0.03; const lg = c.createGain(); lg.gain.value = 0.03; l.connect(lg).connect(g.gain);
        o.connect(g).connect(out); o.start(); l.start(); this.nodes.push(o, l);
      });
    }
    this.out = out; this.current = kind;
  },
  stop() { this.nodes.forEach(n => { try { n.stop(); } catch {} }); this.nodes = []; this.out?.disconnect(); this.current = null; },
  setVol(v) { this.vol = v; if (this.gain) this.gain.gain.value = v; }
};

/* ---------------- timer overlay ---------------- */
function timerOverlay({ title, minutes, steps = [], note = '', onDone }) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  let left = Math.round(minutes * 60), paused = false;
  ov.innerHTML = `<div class="wrap center"><button class="back" id="tclose">✕ Close</button>
    <h2 style="margin-top:20px">${esc(title)}</h2>${note ? `<p class="muted">${esc(note)}</p>` : ''}
    <div class="timer" id="tval"></div>
    <div class="row" style="justify-content:center"><button class="btn quiet" id="tpause">Pause</button><button class="btn" id="tdone">I'm done</button></div>
    ${steps.length ? `<div class="card" style="text-align:left;margin-top:20px"><h3>Little steps</h3><ul>${steps.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
    <p class="small muted" style="margin-top:18px"><button class="btn sm quiet" id="tsnd">🎧 Add calm sound</button></p></div>`;
  document.body.appendChild(ov);
  const show = () => $('#tval', ov).textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  show();
  const iv = setInterval(() => { if (paused) return; left--; show(); if (left <= 0) finish(true); }, 1000);
  function finish(auto) { clearInterval(iv); ov.remove(); if (auto) { toast('Time\'s up — nicely done 🌿'); try { navigator.vibrate?.(200); } catch {} } onDone?.(); }
  $('#tclose', ov).onclick = () => { clearInterval(iv); ov.remove(); };
  $('#tdone', ov).onclick = () => finish(false);
  $('#tpause', ov).onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; };
  $('#tsnd', ov).onclick = openSounds;
}

    { e: '🫁', t: 'Breathe', d: 'Follow the circle. In as it grows, out as it shrinks.', s: 40, breath: true },

  ];
  let i = 0, iv;
  const ov = document.createElement('div'); ov.className = 'overlay'; document.body.appendChild(ov);
  function render() {
    clearInterval(iv);
    if (i >= steps.length) {
      S.rituals[dayKey()] = true; save();
      ov.innerHTML = `<div class="wrap center"><div style="font-size:3rem;margin-top:60px">🏡</div><h1>You've landed.</h1><p class="muted">School or work stays out there. You're home now.</p><button class="btn" id="rdone" style="margin-top:20px">Back to Softland</button></div>`;

      return;
    }
    const st = steps[i]; let left = st.s;
    ov.innerHTML = `<div class="wrap center"><div class="row between"><button class="back" id="rx">✕ Close</button><span class="muted small">Arrival ritual</span></div>
      <div class="step-dot">${steps.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>

      <h2>${st.t}</h2><p class="muted">${st.d}</p><div class="timer" id="rt" style="font-size:2.2rem"></div>
      <div class="row" style="justify-content:center"><button class="btn quiet" id="rskip">Skip</button><button class="btn" id="rnext">Done</button></div></div>`;
    const show = () => $('#rt', ov).textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; show();

}

function energyPatternCard() {
  const cs = S.checkins;
  if (cs.length < 3) return `<div class="card"><h3>📈 Your energy over time</h3><p class="small muted" style="margin:0">After a few check-ins, Softland will start to notice when your energy is usually high or low — and suggest better times for studying, moving, or creative stuff.</p></div>`;
  const buckets = [['Morning', 5, 12], ['Afternoon', 12, 17], ['Evening', 17, 21], ['Night', 21, 29]];
  const avg = buckets.map(([n, a, b]) => {
    const xs = cs.filter(c => { let h = new Date(c.t).getHours(); if (h < 5) h += 24; return h >= a && h < b; }).map(c => c.energy);
    return { n, v: xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : 0, k: xs.length };
  });
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const byDay = days.map((d, i) => { const xs = cs.filter(c => new Date(c.t).getDay() === i).map(c => c.energy); return { d, v: xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : 0 }; });
  const withData = avg.filter(a => a.k);
  const best = withData.slice().sort((a, b) => b.v - a.v)[0];
  const low = withData.slice().sort((a, b) => a.v - b.v)[0];
  const ranked = byDay.filter(d => d.v);
  const lowDay = ranked.slice().sort((a, b) => a.v - b.v)[0];
  let insight = '';
  if (best && low && best !== low) insight = `Your energy tends to be highest in the <b>${best.n.toLowerCase()}</b> and lowest in the <b>${low.n.toLowerCase()}</b>. Maybe save ${isKid() ? 'harder homework' : 'focused tasks'} or exercise for the ${best.n.toLowerCase()}, and keep the ${low.n.toLowerCase()} gentle.`;
  else insight = 'Keep checking in when you feel like it — patterns get clearer over a few weeks.';
  if (lowDay && ranked.length >= 3) insight += ` ${lowDay.d}s often feel heavier — be extra kind to yourself then.`;
  return `<div class="card"><h3>📈 Your energy over time</h3>
    <div class="bars">${byDay.map(d => `<div><i style="height:${d.v ? d.v / 5 * 100 : 0}%;opacity:${d.v ? 1 : .2}"></i><small>${d.d}</small></div>`).join('')}</div>
    <p class="small" style="margin-bottom:0">${insight}</p></div>`;
}

function compassHtml(pri, opt, msg) {

function bindCompass() {

}

function downscale(file, max = 520) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = no; img.src = url;
  });
}
function journalEntry(p) {
  const ov = document.createElement('div'); ov.className = 'overlay'; document.body.appendChild(ov);
  let photo = null; const entry = { id: uid(), t: Date.now(), prompt: p.k, text: '', photo: null, chat: [], gratitude: p.g };

    <div class="row" style="margin-top:10px"><label class="btn sm quiet" style="cursor:pointer">📷 Add photo<input type="file" accept="image/*" id="jp" hidden></label><span id="jpn" class="small muted"></span></div>
    <div id="jprev"></div>
    <button class="btn block" id="js" style="margin-top:12px">Save &amp; chat with Moss</button></div>

  bindMics(ov);
  $('#jx', ov).onclick = () => { ov.remove(); route(); };
  $('#jp', ov).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { photo = await downscale(f); $('#jprev', ov).innerHTML = `<img class="photo" src="${photo}" alt="">`; } catch { toast('Couldn\'t read that photo'); } };
  $('#js', ov).onclick = async () => {
    const text = $('#jt', ov).value.trim();

    save();
    $('#js', ov).textContent = 'Saved ✓'; $('#js', ov).disabled = true;
    const chatBox = $('#jchat', ov);
    const support = needsSupport(text) ? supportCard() : '';
    const renderChat = (pending) => {
      chatBox.innerHTML = support + `<div class="card"><div class="ai-tag">🌿 Talking with Moss</div><div class="chat">${entry.chat.map(m => `<div class="msg ${m.role === 'ai' ? 'ai' : 'me'}">${m.role === 'ai' ? md(m.text) : esc(m.text)}</div>`).join('')}
        ${pending ? '<div class="msg ai"><span class="muted dots">…</span></div>' : ''}</div>
        <div class="inputmic" style="margin-top:10px"><textarea id="jr" style="min-height:60px" placeholder="Reply, or just close when you're done"></textarea>${micBtn('jr')}</div>
        <div class="row" style="margin-top:8px"><button class="btn sm" id="jsend">Send</button><button class="btn sm quiet" id="jdone">I'm done for tonight</button></div></div>`;
      bindMics(chatBox);
      $('#jsend', chatBox).onclick = send; $('#jdone', chatBox).onclick = () => { ov.remove(); toast(entry.gratitude ? 'Added to your memory jar 🫙' : 'Saved. Sleep well 🌙'); route(); };
    };
    const history = () => [{ role: 'user', text: `Journal prompt: "${p.q}"\nMy entry: ${text || '(I added a photo)'}` }, ...entry.chat];
    async function ask() {
      renderChat(true);
      try {
        const r = await ai({ history: history(), task: 'You are reading the user\'s private journal entry as a caring friend. Reflect back one specific thing warmly, then ask ONE gentle follow-up question so it feels like a conversation, not a form. Max ~50 words. If they say they are done, say a cozy goodnight with no question.' });
        entry.chat.push({ role: 'ai', text: r }); save(); speak(r);
      } catch (e) {
        const fallback = e.message === 'nokey' ? (p.g ? 'I love that you noticed that. What made that moment feel good?' : 'Thanks for writing that down. How do you feel now that it\'s out of your head?') : null;
        if (fallback) { entry.chat.push({ role: 'ai', text: fallback }); save(); }
        else { renderChat(false); chatBox.querySelector('.chat').insertAdjacentHTML('beforeend', `<div class="msg ai">${aiErrorHtml(e)}</div>`); return; }
      }
      renderChat(false);
    }
    async function send() {
      const v = $('#jr', chatBox).value.trim(); if (!v) return;
      entry.chat.push({ role: 'user', text: v }); save();
      if (needsSupport(v) && !chatBox.querySelector('.support')) chatBox.insertAdjacentHTML('afterbegin', supportCard());
      await ask();
    }
    ask();
  };
}

        r = 'That\'s a lot to hold. Let\'s make it tiny: **drink some water and write down the one thing that\'s loudest in your head.** That\'s it. Everything else can wait until you\'ve had a breath.';
      }
      out.innerHTML = support + `<div class="card soft"><div class="ai-tag">🌿 Moss</div><div class="reply">${md(r)}</div></div>`;
      speak(r);
    };
  };
  const grounding = () => {
    const steps = [['👀', '5 things you can see'], ['✋', '4 things you can touch'], ['👂', '3 things you can hear'], ['👃', '2 things you can smell'], ['👅', '1 thing you can taste']];
    let i = 0;
    const draw = () => {
      if (i >= steps.length) { ov.innerHTML = `<div class="wrap center"><div style="font-size:3rem;margin-top:70px">🌿</div><h2>You're here. You're okay.</h2><button class="btn" id="gb" style="margin-top:16px">Back</button></div>`; $('#gb', ov).onclick = home; return; }
      ov.innerHTML = `<div class="wrap center"><div class="step-dot" style="margin-top:30px">${steps.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div><div style="font-size:4rem;margin:50px 0 10px">${steps[i][0]}</div>
        <h1>Notice ${steps[i][1]}</h1><p class="muted">Take your time. Name them in your head or out loud.</p><button class="btn" id="gn" style="margin-top:20px">Next</button></div>`;
      $('#gn', ov).onclick = () => { i++; draw(); };
    };
    draw();
  };
  home();
}

/* ----- Weekly look-back ----- */
views.lookback = () => {
  const weekAgo = Date.now() - 7 * 864e5;
  const cs = S.checkins.filter(c => c.t > weekAgo), js = S.journal.filter(j => j.t > weekAgo), hs = S.explore.history.filter(h => h.t > weekAgo);
  const avg = cs.length ? (cs.reduce((s, c) => s + c.energy, 0) / cs.length).toFixed(1) : '–';
  const last = S.lookbacks[S.lookbacks.length - 1];
  app.innerHTML = `<div class="wrap"><a class="back" href="#more">← More</a><h1>Weekly look-back</h1>
    <p class="muted">A gentle look at your week — what you enjoyed, what drained you, what you're grateful for.</p>
    <div class="bigtime"><div><small>CHECK-INS</small><b>${cs.length}</b></div><div><small>AVG ENERGY</small><b>${avg}</b></div><div><small>JOURNAL</small><b>${js.length}</b></div></div>
    <button class="btn block" id="lb" style="margin:14px 0">Make my look-back</button>
    <div id="out">${last ? lookbackCard(last) : ''}</div></div>`;
  $('#lb').onclick = async () => {
    if (!cs.length && !js.length && !hs.length) { toast('Not much to look back on yet — check in a few times this week'); return; }
    $('#out').innerHTML = `<div class="card soft">${thinking('Looking back on your week')}</div>`;
    const data = [
      'Check-ins: ' + cs.map(c => `${new Date(c.t).toLocaleDateString([], { weekday: 'short' })} energy ${c.energy}/5 ${c.moods.join('/')} ${c.note ? '"' + c.note + '"' : ''}`).join('; '),
      'Journal: ' + js.map(j => `[${j.prompt}] ${j.text.slice(0, 300)}`).join(' | '),
      'Tasters tried: ' + hs.map(h => `${h.name} (${h.feel})`).join(', ')
    ].join('\n');
    let r;
    try {
      r = await ai({ prompt: data, task: 'Write the user\'s short Sunday weekly look-back from their data. Use exactly these four short sections with bold labels: **What you enjoyed**, **What drained you**, **What you\'re grateful for**, **One gentle idea for next week**. 1-2 sentences each, warm, no judgement about missed days.' });
    } catch (e) {
      if (e.message !== 'nokey') { $('#out').innerHTML = `<div class="card soft">${aiErrorHtml(e)}</div>`; return; }
      const loved = hs.filter(h => h.feel === 'loved').map(h => h.name);
      r = `**What you enjoyed:** ${loved.length ? loved.join(', ') : 'Look through your journal — there were good bits.'}\n**What drained you:** Your lowest energy check-ins were on ${[...new Set(cs.filter(c => c.energy <= 2).map(c => new Date(c.t).toLocaleDateString([], { weekday: 'long' })))].join(', ') || 'no particular day'}.\n**What you're grateful for:** ${js.filter(j => j.gratitude).length} gratitude moments went into your jar.\n**One gentle idea for next week:** Try one new 15-minute taster.`;
    }
    const lb = { t: Date.now(), text: r }; S.lookbacks.push(lb); save();
    $('#out').innerHTML = lookbackCard(lb);
  };
};
const lookbackCard = lb => `<div class="card soft"><div class="ai-tag">🌿 Your week · ${new Date(lb.t).toLocaleDateString([], { month: 'short', day: 'numeric' })}</div><div class="reply">${md(lb.text)}</div></div>`;

/* ----- More ----- */
views.more = () => {
  app.innerHTML = `<div class="wrap"><h1>More</h1>
    <div class="tiles">
      <a class="tile" href="#explore" style="text-decoration:none;color:inherit"><span class="em">🎨</span><b>Explore</b><small>15-minute tasters</small></a>
      <a class="tile" href="#focus" style="text-decoration:none;color:inherit"><span class="em">${isKid() ? '📚' : '💼'}</span><b>${isKid() ? 'Study helper' : 'Work helper'}</b><small>Energy-matched</small></a>
      <a class="tile" href="#lookback" style="text-decoration:none;color:inherit"><span class="em">🗓️</span><b>Weekly look-back</b><small>Your week, gently</small></a>
      <a class="tile" href="#jar" style="text-decoration:none;color:inherit"><span class="em">🫙</span><b>Memory jar</b><small>Good moments</small></a>
      <button class="tile" id="msnd"><span class="em">🎧</span><b>Soundscapes</b><small>Rain, waves, hum</small></button>

      ${S.settings.buddy.on || (isKid() && S.settings.parent.on) ? `<button class="tile" id="mshare"><span class="em">🤝</span><b>Share how I'm doing</b><small>${S.settings.buddy.on ? 'Buddy check-in' : 'Parent signal'}</small></button>` : ''}

    </div>

  $('#msnd').onclick = openSounds; $('#mrit').onclick = arrivalRitual;
  $('#mshare') && ($('#mshare').onclick = () => S.settings.buddy.on ? shareBuddy() : shareParent());
};

/* ----- Sharing (off by default, never shares journal content) ----- */
async function shareText(text) {
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied — paste it in a message'); } catch { prompt('Copy this:', text); }
}
function shareBuddy() {
  const c = todaysCheckin();
  const line = c ? `${ENERGY[c.energy - 1][0]} energy ${c.energy}/5${c.moods.length ? ', feeling ' + c.moods.slice(0, 2).join(' & ') : ''}` : 'checking in 🌿';
  sheet(`<h2>Buddy check-in</h2><p class="muted small">A one-line check-in for ${esc(S.settings.buddy.name || 'your buddy')}. Only this line is shared — never your journal.</p>
    <input type="text" id="bl" value="${esc(`Softland check-in from ${S.profile.name || 'me'}: ${line}`)}">
    <button class="btn block" id="bs" style="margin-top:12px">Share</button>`, (el, close) => { $('#bs', el).onclick = () => { shareText($('#bl', el).value); close(); }; });
}
function shareParent() {
  sheet(`<h2>How I'm doing</h2><p class="muted small">Send a simple signal to a parent. Nothing else is shared — never your journal or check-in notes.</p>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">${[['☀️', 'Doing good'], ['🌤️', 'Doing okay'], ['🌧️', 'Rough day — could use a hug']].map(([e, l]) => `<button class="tile" data-sig="${e} ${l}" style="min-height:90px;align-items:center;text-align:center"><span class="em">${e}</span><b class="small">${l}</b></button>`).join('')}</div>`,
    (el, close) => $$('[data-sig]', el).forEach(b => b.onclick = () => { shareText(`${S.profile.name || 'Your kid'} on Softland: ${b.dataset.sig}`); close(); }));
}

/* ----- Settings ----- */
views.settings = () => {
  const st = S.settings, p = S.profile;
  app.innerHTML = `<div class="wrap"><a class="back" href="#more">← More</a><h1>Settings</h1>
    <div class="card"><h2>You</h2>
      <label class="lbl" for="sname">Name</label><input type="text" id="sname" value="${esc(p.name)}">
      <label class="lbl">Account type</label><div class="chips"><button class="chip ${p.type === 'kid' ? 'on' : ''}" data-t="kid">🎒 Student (School mode)</button><button class="chip ${p.type === 'adult' ? 'on' : ''}" data-t="adult">💼 Adult (Work mode)</button></div>
      <div class="grid2"><div><label class="lbl" for="sarr">Usual arrival home</label><input type="time" id="sarr" value="${esc(p.arrival || '')}"></div>
      <div><label class="lbl" for="ssl">Sleep you need</label><select id="ssl">${[7, 7.5, 8, 8.5, 9, 9.5, 10].map(h => `<option ${+p.sleepHours === h ? 'selected' : ''} value="${h}">${h} h</option>`).join('')}</select></div></div></div>
    <div class="card"><h2>AI (Google Gemini)</h2>
      <p class="small muted">Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It's stored only in this browser and sent only to Google. Note: on Google's free tier, Google may use prompts to improve its products — so avoid writing anything you'd never want anyone to read.</p>
      <label class="lbl" for="skey">API key</label><div class="row" style="flex-wrap:nowrap"><input type="password" id="skey" value="${esc(st.apiKey)}" autocomplete="off" placeholder="AIza…"><button class="iconbtn" id="eye" aria-label="Show key">👁️</button></div>
      <label class="lbl" for="smodel">Model</label><input type="text" id="smodel" value="${esc(st.model)}" placeholder="gemini-flash-latest">
      <p class="small muted">Leave as <code>gemini-flash-latest</code> unless you know you want another one.</p>
      <button class="btn sm quiet" id="test">Test connection</button> <span id="tres" class="small"></span></div>
    <div class="card"><h2>Comfort</h2>
      <label class="switch"><span>🔊 Read Moss's replies out loud</span><input type="checkbox" id="svoice" ${st.voiceReplies ? 'checked' : ''}></label>
      <label class="switch"><span>🔔 Soft reminders<br><small class="muted">"How are you?" at arrival time, and a screens-off nudge. Works while Softland is open or installed.</small></span><input type="checkbox" id="snudge" ${st.nudges ? 'checked' : ''}></label>
      <label class="lbl">Theme</label><div class="chips">${[['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button class="chip ${st.theme === k ? 'on' : ''}" data-th="${k}">${l}</button>`).join('')}</div>
      <p class="small muted" style="margin-top:12px">📱 Tip: add Softland to your home screen (Share → "Add to Home Screen" on iPhone, or the install option in your browser menu) so it's one tap away when you get home.</p></div>
    <div class="card"><h2>Sharing <span class="pill">off by default</span></h2>
      <p class="small muted">Sharing never includes journal entries or private notes.</p>
      <label class="switch"><span>🤝 Optional buddy — share a one-line daily check-in with one trusted person</span><input type="checkbox" id="sbuddy" ${st.buddy.on ? 'checked' : ''}></label>
      <div id="bname" ${st.buddy.on ? '' : 'hidden'}><input type="text" id="sbn" placeholder="Buddy's name" value="${esc(st.buddy.name)}"></div>
      ${p.type === 'kid' ? `<label class="switch"><span>👪 Light parent view — send a simple "how I'm doing" signal</span><input type="checkbox" id="sparent" ${st.parent.on ? 'checked' : ''}></label>` : ''}</div>
    <div class="card"><h2>Your data</h2><p class="small muted">Everything lives on this device only. No account, no server.</p>
      <div class="row"><button class="btn sm quiet" id="exp">Download my data</button><button class="btn sm quiet" id="wipe" style="color:#B5524F">Delete everything</button></div></div>
    <p class="small muted center">Softland · a soft landing after a hard day 🌿</p></div>`;
  const persist = () => {
    p.name = $('#sname').value.trim(); p.arrival = $('#sarr').value; p.sleepHours = +$('#ssl').value;
    st.apiKey = $('#skey').value.trim(); st.model = $('#smodel').value.trim() || 'gemini-flash-latest';
    st.voiceReplies = $('#svoice').checked; st.buddy.on = $('#sbuddy').checked; st.buddy.name = $('#sbn').value.trim();
    if ($('#sparent')) st.parent.on = $('#sparent').checked;
    save();
  };
  $$('input,select', app).forEach(i => i.addEventListener('change', persist));
  $$('[data-t]').forEach(b => b.onclick = () => { persist(); p.type = b.dataset.t; save(); views.settings(); });
  $$('[data-th]').forEach(b => b.onclick = () => { st.theme = b.dataset.th; save(); applyTheme(); views.settings(); });
  $('#sbuddy').addEventListener('change', () => $('#bname').hidden = !$('#sbuddy').checked);
  $('#eye').onclick = () => { const k = $('#skey'); k.type = k.type === 'password' ? 'text' : 'password'; };
  $('#snudge').onchange = async e => {
    if (e.target.checked && 'Notification' in window && Notification.permission !== 'granted') {
      const r = await Notification.requestPermission(); if (r !== 'granted') { e.target.checked = false; toast('Notifications are blocked in your browser'); }
    }
    st.nudges = e.target.checked; save();
  };
  $('#test').onclick = async () => {
    persist(); $('#tres').textContent = 'Testing…';
    try { const r = await ai({ prompt: 'Say hi in five words or fewer.' }); $('#tres').textContent = '✅ Working! Moss says: ' + r; }
    catch (e) { $('#tres').textContent = e.message === 'nokey' ? 'Paste a key first.' : '❌ ' + e.message; }
  };
  $('#exp').onclick = () => { const a = document.createElement('a'); const data = { ...S, settings: { ...S.settings, apiKey: '' } };
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = `softland-${dayKey()}.json`; a.click(); };
  $('#wipe').onclick = () => { if (confirm('Delete all your Softland data from this device? This can\'t be undone.')) { localStorage.removeItem(STORE); S = structuredClone(DEFAULTS); location.hash = ''; route(); } };
};

/* ---------------- reminders (soft, only while open/installed) ---------------- */
function nudge(title, body) {
  if (!S.settings.nudges) return;
  if ('Notification' in window && Notification.permission === 'granted') {
    navigator.serviceWorker?.ready.then(r => r.showNotification(title, { body, icon: 'icon.svg', tag: title })).catch(() => new Notification(title, { body, icon: 'icon.svg' }));
  } else toast(`${title} — ${body}`, 5000);
}
setInterval(() => {
  if (!S.profile || !S.settings.nudges) return;
  const now = new Date(), hm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`, k = dayKey();
  if (S.profile.arrival && hm === S.profile.arrival && !S.fired['arr' + k]) { S.fired['arr' + k] = 1; save(); nudge('Softland 🌿', 'Hey, you\'re home. How are you?'); }
  const plan = S.plans[tomorrowKey()];
  if (plan?.screensOff && hm === plan.screensOff && !S.fired['wd' + k]) { S.fired['wd' + k] = 1; save(); nudge('Wind-down time 🌙', `Maybe start putting screens away — bed by ${fmt12(plan.bed)} for your ${fmt12(plan.wake)} wake-up.`); }
}, 20000);

/* ---------------- router ---------------- */
function route() {
  window.scrollTo(0, 0);
  if (!S.profile) { $('#tabs').hidden = true; $('#fab').hidden = true; views.onboard(); return; }
  const name = (location.hash.slice(1) || 'home');
  const v = views[name] && name !== 'onboard' ? name : 'home';
  $('#tabs').hidden = false; $('#fab').hidden = false;
  const tab = { explore: 'more', focus: 'more', lookback: 'more', settings: 'more', jar: 'journal' }[v] || v;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === tab));
  views[v]();
}
$$('#tabs button').forEach(b => b.onclick = () => { if (location.hash === '#' + b.dataset.go) route(); else location.hash = b.dataset.go; });
$('#fab').onclick = overwhelm;
window.addEventListener('hashchange', route);
route();

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
